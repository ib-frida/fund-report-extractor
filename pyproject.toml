[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-report-extractor"
version = "0.1.0"
description = "LLM extraction of private-fund performance data from PDF reports, with automated validation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Frida Ibarra" }]
dependencies = [
  "pdfplumber>=0.11",
  "pandas>=2.0",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "requests>=2.31",
  "tabulate>=0.9",
]

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest>=8"]

[project.scripts]
fundx = "fundx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/fundx/parsing.py"]
addopts = "--doctest-modules"
